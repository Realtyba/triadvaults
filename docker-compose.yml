services:
  app:
    build: .
    restart: unless-stopped
    # Sin `ports:`: no hace falta publicar 3001 en el host. Coolify enruta al
    # contenedor por la red interna de Docker a través de Traefik; publicarlo
    # además en el host expondría el juego sin pasar por su SSL.
    expose:
      - "3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
