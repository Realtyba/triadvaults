# Empaquetado de escritorio. Se genera con `npm run dist:linux` / `npm run dist:win`.
#
# En fichero aparte y no dentro de package.json a propósito: la configuración de
# empaquetado necesita comentarios —qué se incluye y por qué, qué formato espera cada
# tienda— y JSON no los admite.

appId: com.triadvaults.game
productName: Triad Vaults
copyright: Triad Vaults

# ⚠ El .deb exige además una página de proyecto (`homepage` en package.json) y un
# responsable (`linux.maintainer`, más abajo). Los dos van con marcador de posición
# sobre el dominio reservado `.invalid`, que nunca resuelve: son datos que hay que
# rellenar antes de publicar en ningún sitio, no inventar.

directories:
  output: release
  buildResources: build

# La lista blanca no basta por sí sola: electron-builder añade siempre las
# `dependencies` de package.json, así que sin la exclusión final se colaban en el
# instalable `express`, `socket.io` y compañía —código de servidor que el jugador no
# ejecuta— y con ellos toda su superficie de ataque. (`pg` y `nodemailer` ya ni
# siquiera son dependencias: la persistencia y el correo se fueron a realtyba-api.)
#
# Aquí no hace falta ninguna: el cliente es un paquete de Vite con todo dentro, y
# Electron solo carga `dist/index.html` y los dos ficheros de `electron/`.
files:
  - dist/**/*
  - electron/**/*
  - package.json
  - '!node_modules/**/*'
  # Reincluido DESPUÉS de la exclusión, que es lo único que la deshace: el puente
  # con Steam sí necesita su módulo nativo dentro del paquete.
  - 'node_modules/steamworks.js/**/*'

# El servidor NO se empaqueta. El juego de escritorio es el cliente: en solitario
# corre entero en local (ver `OfflineStore`), y para jugar acompañado se conecta a los
# servicios que indiquen TRIADVAULTS_API_URL y VITE_SOCKET_URL al construir.

asar: true

# Lo que queda FUERA del archivo asar. Un `.node` no se puede cargar desde dentro:
# el sistema operativo necesita un fichero de verdad en el disco para enlazarlo, y
# el asar es un único blob. Sin esto, `require('steamworks.js')` falla en la build
# empaquetada —y solo ahí, nunca en desarrollo—, que es la peor clase de fallo.
# Las bibliotecas de Steam (`libsteam_api.so`, `steam_api64.dll`) van con ellos por
# el mismo motivo: el `.node` las carga en tiempo de ejecución.
asarUnpack:
  - 'node_modules/steamworks.js/dist/**'

# Construir el instalador de Windows DESDE Linux necesita `wine` en el sistema; sin
# él, `npm run dist:win` falla con "spawn wine ENOENT". Desde Windows no hace falta
# nada. `dist:linux` no tiene esa dependencia.
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png

# Firma de código: preparada y APAGADA. Sin certificados no se firma nada, y no se
# van a inventar. Cuando existan, electron-builder los toma del entorno sin tocar
# este fichero: CSC_LINK + CSC_KEY_PASSWORD en Windows, y en macOS APPLE_ID +
# APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID para notarizar.
#
# Lo que cuesta no firmar: en Windows, SmartScreen avisa de "editor desconocido" y
# hay que pulsar dos veces para instalar; en macOS, Gatekeeper directamente se niega
# a abrirlo. Por Steam esto no importa —Steam distribuye por su cuenta—, fuera de
# Steam sí. Ver docs/DISTRIBUTION.md.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Triad Vaults

# macOS solo se puede compilar DESDE macOS: la cadena de herramientas de Apple no
# existe en otros sistemas. Esta configuración está escrita pero sin probar, y así se
# dice en docs/DISTRIBUTION.md en lugar de darla por buena.
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip # el formato que espera Steam para un depot de macOS
      arch: [x64, arm64]
  icon: build/icon.png
  category: public.app-category.games
  # Obligatorio para poder notarizar. Sin notarizar, Gatekeeper no lo abre.
  hardenedRuntime: true

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: build/icon.png
  category: Game
  maintainer: Triad Vaults <maintainer@triadvaults.invalid> # ⚠ marcador, ver arriba
  # Sin esto el escritorio no asocia la ventana abierta con su icono del lanzador:
  # el juego aparece en la barra de tareas como una entrada genérica y sin nombre.
  syncDesktopName: true
  synopsis: Escape cooperativo de bóvedas procedurales
  description: >
    Juego de escape cooperativo para hasta tres agentes. Cada bóveda se genera con
    una semilla compartida, así que todos los jugadores de una sala recorren
    exactamente el mismo mapa.

# Sin publicación automática: subir a ninguna parte es una decisión de quien
# publica, no un efecto secundario de compilar.
publish: null
