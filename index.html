<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- `viewport-fit=cover` deja pintar bajo el notch y la barra de gestos; lo que
       no debe quedar debajo se aparta con `env(safe-area-inset-*)` desde el CSS.
       El zoom se desactiva porque un doble toque accidental durante una huida
       ampliaba la pantalla y no había forma cómoda de volver. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Triad Vaults — Procedural Cyberpunk Co-op Escape</title>
  <meta name="description" content="Triad Vaults: un juego cooperativo de escape procedural para 1-3 jugadores. Resuelve acertijos, evita al fantasma y escapa de bóvedas generadas algorítmicamente.">
  <meta name="theme-color" content="#060812">
  <meta property="og:title" content="Triad Vaults — Procedural Cyber Escape">
  <meta property="og:description" content="Cooperativo 3D de escape procedural. Resuelve puzles con hasta 3 agentes mientras un fantasma te persigue.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Triad Vaults">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <!-- Canvas 3D -->
  <div id="canvas-container"></div>

  <!-- UI Overlay -->
  <div id="ui-layer"></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
